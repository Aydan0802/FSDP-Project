<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the bottom bar sit clear of the iPhone home bar (env(safe-area-inset-bottom) in base.css) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pause & Prove</title>
  <!-- The logo in the browser tab -->
  <link rel="icon" type="image/png" href="img/pause&amp;prove_logo.png">
  <meta name="description" content="Pause & Prove: a student prototype of anti-AI-scam tools for OCBC's Digital Trust challenge. Not a real OCBC service.">

  <!-- Owner: SHARED (whole team). Every file is already linked below, so nobody needs to edit
       this page again. Each person only changes the files listed under their own name. -->

  <!-- Clarity's font, from Google Fonts. Without internet the page falls back to Segoe UI.
       Plus Jakarta Sans has no Tamil letters, so Noto Sans Tamil draws those. The browser only
       downloads it when a page actually shows Tamil. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared styles: base first, then the Clarity theme -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/clarity.css">

  <!-- Feature styles, one file per feature -->
  <!-- Jiliana -->
  <link rel="stylesheet" href="css/features/login.css">
  <link rel="stylesheet" href="css/features/pause-verify.css">
  <link rel="stylesheet" href="css/features/learn-signs.css">
  <link rel="stylesheet" href="css/features/passphrase.css">
  <!-- Aydan -->
  <link rel="stylesheet" href="css/features/analyser.css">
  <!-- Jose -->
  <link rel="stylesheet" href="css/features/risk-scorer.css">
  <link rel="stylesheet" href="css/features/report.css">
  <link rel="stylesheet" href="css/features/freeze.css">
  <!-- Yan Lin -->
  <link rel="stylesheet" href="css/features/call-match.css">
  <link rel="stylesheet" href="css/features/customer-home.css">
  <link rel="stylesheet" href="css/features/caller-check.css">
  <!-- Wei Ye -->
  <link rel="stylesheet" href="css/features/triage-console.css">
  <link rel="stylesheet" href="css/features/triage-overview.css">
  <!-- Shared: Someone is calling me now -->
  <link rel="stylesheet" href="css/features/calling-now.css">
</head>
<body data-theme="clarity">
  <!-- The skip link and the demo banner stay on every screen. The router draws the current
       screen inside <div id="app">. -->
  <!-- data-i18n="key": i18n.js swaps these words when the language changes (the router never redraws them) -->
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <div class="demo-bar">
    <p><strong data-i18n="demo.title">Student prototype.</strong> <span data-i18n="demo.text">Not a real OCBC service. All data is made up.</span></p>
  </div>
  <div id="app"></div>

  <!-- Scripts run in this order. Core first, so the helpers and registerRoute() exist before
       any feature file uses them. -->

  <!-- Core: SHARED (whole team), except access.js (Wei Ye) and i18n.js (Jose).
       i18n.js goes first: it defines t(), which every file below uses for its words. -->
  <script src="js/core/i18n.js"></script>
  <script src="js/core/helpers.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/a11y.js"></script>
  <script src="js/core/access.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Made-up data, one file per feature -->
  <!-- Jiliana -->
  <script src="js/data/login.js"></script>
  <script src="js/data/pause-verify.js"></script>
  <script src="js/data/learn-signs.js"></script>
  <script src="js/data/passphrase.js"></script>
  <!-- Aydan -->
  <script src="js/data/analyser.js"></script>
  <script src="js/data/coming-soon.js"></script>
  <!-- Jose -->
  <script src="js/data/risk-scorer.js"></script>
  <script src="js/data/report.js"></script>
  <script src="js/data/freeze.js"></script>
  <script src="js/data/call-match-logic.js"></script>
  <!-- Yan Lin -->
  <script src="js/data/call-match.js"></script>
  <script src="js/data/evidence-checker.js"></script>
  <script src="js/data/customer-home.js"></script>
  <script src="js/data/caller-check.js"></script>
  <!-- Wei Ye -->
  <script src="js/data/triage-console.js"></script>
  <script src="js/data/triage-overview.js"></script>
  <!-- Shared: Someone is calling me now -->
  <script src="js/data/calling-now.js"></script>

  <!-- Feature screens, one file per feature -->
  <!-- Jiliana -->
  <script src="js/features/login.js"></script>
  <script src="js/features/pause-verify.js"></script>
  <script src="js/features/learn-signs.js"></script>
  <script src="js/features/passphrase.js"></script>
  <!-- Aydan -->
  <!-- The text detector (red-flag rules, runs on this device). Load in this order, before analyser.js -->
  <script src="text%20detector%20prototype/detector/rules_zh.js"></script>
  <script src="text%20detector%20prototype/detector/rules_ms.js"></script>
  <script src="text%20detector%20prototype/detector/rules.js"></script>
  <script src="text%20detector%20prototype/detector/words.js"></script>
  <script src="text%20detector%20prototype/detector/checker.js"></script>
  <script src="js/features/analyser.js"></script>
  <script src="js/features/coming-soon.js"></script>
  <!-- Jose (call-match-logic.js must load before Yan Lin's call-match.js, which uses it) -->
  <script src="js/features/risk-scorer-logic.js"></script>
  <script src="js/features/risk-scorer.js"></script>
  <script src="js/features/report.js"></script>
  <script src="js/features/freeze.js"></script>
  <script src="js/features/call-match-logic.js"></script>
  <script src="js/features/staff-reports.js"></script>
  <!-- Yan Lin -->
  <script src="js/features/call-match.js"></script>
  <!-- Reading text from pictures and PDFs, on this device (nothing is uploaded) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }
  </script>
  <!-- The AI label check: looks inside a picture for labels AI tools leave (content credentials,
       IPTC "made by AI"), on this device. Load in this order, before evidence-checker.js -->
  <script src="image%20detector%20prototype/detector/metadata.js"></script>
  <script src="image%20detector%20prototype/detector/checker.js"></script>
  <script src="image%20detector%20prototype/detector/c2pa.js"></script>
  <script src="js/features/evidence-checker.js"></script>
  <script src="js/features/customer-home.js"></script>
  <script src="js/features/caller-check.js"></script>
  <!-- Wei Ye -->
  <script src="js/features/triage-console.js"></script>
  <script src="js/features/triage-overview.js"></script>
  <!-- Shared: Someone is calling me now -->
  <script src="js/features/calling-now.js"></script>
</body>
</html>
