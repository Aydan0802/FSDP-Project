<!DOCTYPE html>
<html lang="en" data-size="normal" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify the Caller – senior flow preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --font-body: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
  --bg: #F3F5F7; --card: #FFFFFF; --ink: #1F2A33; --muted: #55636D; --border: #E1E6EA;
  --red: #C8102E; --red-dark: #9E0B22; --red-tint: #FCE8EA;
  --green: #1D7346; --green-tint: #E5F4EC;
  --mark: #FFE066; --mark-ink: #1F2A33;
  --radius: 14px; --radius-lg: 22px;
  --shadow: 0 1px 2px rgba(54,59,64,.06), 0 8px 24px rgba(54,59,64,.08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { font-size: 112.5%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html[data-size="large"] { font-size: 128%; }
html[data-size="larger"] { font-size: 146%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5; }
h1, h2, h3 { font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin: 0 0 .4em; }
h1 { font-size: 1.75rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; max-width: 60ch; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; border-radius: 8px; }
h1:focus, h2:focus { outline: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.banner { background: var(--ink); color: var(--bg); font-size: .78rem; text-align: center; padding: .35rem 1rem; }
.app-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); box-shadow: 0 1px 0 var(--border), 0 4px 16px rgba(54,59,64,.05); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.header-in { max-width: 46rem; margin: 0 auto; padding: .6rem 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .5rem; font-weight: 800; text-decoration: none; margin-right: auto; }
.brand-mark { width: 2rem; height: 2rem; border-radius: 10px; background: var(--red); color: #fff; display: grid; place-items: center; }
.brand-mark svg { width: 1.1rem; height: 1.1rem; }
.text-size { display: flex; gap: .25rem; align-items: center; }
.text-size button, .read-btn { font: inherit; font-weight: 700; border: 1.5px solid var(--border); background: var(--card); color: var(--ink); border-radius: 999px; padding: .3rem .7rem; cursor: pointer; min-height: 2.5rem; }
.text-size button[aria-pressed="true"] { background: var(--red-tint); border-color: var(--red); color: var(--red-dark); }
.read-btn { display: inline-flex; align-items: center; gap: .4rem; }
.read-btn svg { width: 1.1rem; height: 1.1rem; }
.read-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

main { max-width: 46rem; margin: 0 auto; padding: 1.25rem 1rem 6rem; }
.card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.25rem; margin-bottom: 1rem; }
.icon { width: 1.4rem; height: 1.4rem; flex: none; }

/* ---------- Buttons ---------- */
.btn { font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3.25rem; padding: .7rem 1.4rem; border-radius: 999px; border: 2px solid transparent; text-decoration: none; cursor: pointer; text-align: center; }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }
.btn-secondary { background: var(--card); color: var(--ink); border-color: var(--ink); }
.btn-link { background: none; color: var(--ink); text-decoration: underline; min-height: 2.75rem; padding: .4rem .5rem; }
.btn-block { display: flex; width: 100%; }
.stack { display: grid; gap: .75rem; margin-top: 1rem; }

/* ---------- Home: the help-now panel (the one loud thing on the page) ---------- */
.hello h1 { margin-bottom: .2rem; }
.hello p { color: var(--muted); }
.help-now { background: var(--red-tint); border: 2px solid var(--red); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
.help-now h2 { color: var(--red-dark); font-size: 1.45rem; }
.big-choice { display: flex; align-items: center; gap: 1rem; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--red); border-radius: var(--radius); padding: 1rem 1.1rem; text-decoration: none; cursor: pointer; min-height: 4.5rem; }
.big-choice:hover { background: var(--bg); }
.big-choice .icon-wrap { width: 3rem; height: 3rem; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
.big-choice .icon-wrap svg { width: 1.5rem; height: 1.5rem; }
.big-choice strong { display: block; font-size: 1.15rem; }
.big-choice span.sub { color: var(--muted); font-size: .9rem; }
.big-choice .chev { margin-left: auto; width: 1.4rem; height: 1.4rem; color: var(--red); flex: none; }
.call-line { margin: 1rem 0 0; font-weight: 600; }
.call-line a { font-weight: 800; color: var(--red-dark); white-space: nowrap; }

.group-title { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.75rem 0 .25rem; }
.group-sub { color: var(--muted); margin-bottom: .8rem; }
.tiles { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .6rem; }
.tile { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); text-decoration: none; min-height: 4rem; border: 2px solid transparent; }
.tile:hover { border-color: var(--border); }
.tile .icon { color: var(--red); }
.tile strong { display: block; }
.tile span.sub { display: block; font-size: .88rem; color: var(--muted); }

details.recent { margin-top: 1.25rem; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
details.recent summary { cursor: pointer; padding: 1rem; font-weight: 700; min-height: 3rem; }
details.recent ul { list-style: none; margin: 0; padding: 0 1rem 1rem; display: grid; gap: .6rem; }
details.recent li { display: flex; justify-content: space-between; gap: 1rem; align-items: center; border-top: 1px solid var(--border); padding-top: .6rem; }
.badge { display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; font-size: .85rem; padding: .2rem .6rem; border-radius: 999px; white-space: nowrap; }
.badge svg { width: 1rem; height: 1rem; }
.badge-bad { background: var(--red-tint); color: var(--red-dark); }
.badge-unsure { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }

/* ---------- Stress flow ---------- */
.flow-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
.step-dots { display: flex; gap: .35rem; align-items: center; color: var(--muted); font-weight: 600; font-size: .9rem; }
.step-dots i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--border); display: inline-block; }
.step-dots i.on { background: var(--red); }
.calm { display: inline-flex; align-items: center; gap: .4rem; background: var(--green-tint); color: var(--green); font-weight: 700; padding: .3rem .8rem; border-radius: 999px; margin-bottom: .75rem; }
.calm svg { width: 1.1rem; height: 1.1rem; }
.flow h1 { font-size: 2rem; }
.rules { list-style: none; padding: 0; margin: 1rem 0; display: grid; gap: .5rem; }
.rules li { display: flex; gap: .6rem; align-items: flex-start; font-weight: 600; font-size: 1.05rem; }
.rules li svg { color: var(--red); margin-top: .15rem; }
.answer-btns .btn { min-height: 4rem; font-size: 1.15rem; }
.done-mark { width: 4rem; height: 4rem; border-radius: 50%; background: var(--green-tint); color: var(--green); display: grid; place-items: center; margin-bottom: .75rem; }
.done-mark svg { width: 2rem; height: 2rem; }
.call-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); box-shadow: 0 -1px 0 var(--border), 0 -6px 18px rgba(54,59,64,.08); padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom, 0px)); }
.call-bar .in { max-width: 46rem; margin: 0 auto; display: flex; align-items: center; gap: .75rem; justify-content: space-between; flex-wrap: wrap; }
.call-bar p { margin: 0; font-weight: 600; font-size: .92rem; }

/* ---------- Read-along highlighting ---------- */
.w { border-radius: 4px; transition: background-color .08s; }
.w.now { background: var(--mark); color: var(--mark-ink); box-shadow: 0 0 0 2px var(--mark); }
.reading [data-read] { outline: 2px dashed var(--border); outline-offset: 6px; border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { .w { transition: none; } }

.note { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; padding-top: 1rem; }
:root { --amber: #7A4F00; --amber-tint: #FFF3D1; }
.page-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
.lead { color: var(--muted); font-size: 1.05rem; }
.tile-wide { grid-column: 1 / -1; border-color: var(--red); }
.tile-wide .icon { width: 1.8rem; height: 1.8rem; }

/* One drop box for everything */
.drop { display: grid; place-items: center; text-align: center; gap: .4rem; border: 2.5px dashed var(--field, #6B7A84); border-radius: var(--radius-lg); padding: 1.75rem 1rem; cursor: pointer; background: var(--bg); }
.drop:hover, .drop.over { border-color: var(--red); background: var(--red-tint); }
.drop .icon { width: 2.4rem; height: 2.4rem; color: var(--red); }
.drop strong { font-size: 1.15rem; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--red); outline-offset: 3px; }
.or { text-align: center; color: var(--muted); font-weight: 700; margin: 1rem 0 .5rem; }
label.field { display: block; font-weight: 700; margin: .9rem 0 .35rem; }
textarea, input[type="text"], input[type="tel"], input[type="number"], select { font: inherit; width: 100%; padding: .75rem .9rem; border: 2px solid #6B7A84; border-radius: 12px; background: var(--card); color: var(--ink); min-height: 3.25rem; }
textarea { min-height: 7rem; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
.chip { font: inherit; font-weight: 600; font-size: .92rem; border: 1.5px solid var(--border); background: var(--card); color: var(--ink); padding: .45rem .9rem; border-radius: 999px; cursor: pointer; min-height: 2.75rem; display: inline-flex; align-items: center; gap: .4rem; }
.chip .icon { width: 1.1rem; height: 1.1rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.detected { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; border-radius: var(--radius); background: var(--bg); margin-bottom: 1rem; }
.detected .icon { width: 2rem; height: 2rem; color: var(--red); }
.detected small { display: block; color: var(--muted); }
.progress-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .6rem; }
.progress-list li { display: flex; gap: .6rem; align-items: center; font-weight: 600; color: var(--muted); }
.progress-list li.done { color: var(--ink); }
.progress-list li.done .icon { color: var(--green); }
.progress-list li.now { color: var(--ink); }
.spin { width: 1.4rem; height: 1.4rem; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--border); border-right-color: var(--red); } }
.dot { width: 1.4rem; height: 1.4rem; border: 3px solid var(--border); border-radius: 50%; flex: none; }

/* Results: always icon + words, never colour alone */
.verdict { display: flex; gap: .9rem; align-items: flex-start; border-radius: var(--radius-lg); padding: 1.1rem 1.2rem; margin-bottom: 1rem; border: 2px solid; }
.verdict .icon { width: 2.2rem; height: 2.2rem; }
.verdict h1, .verdict h2 { margin: 0 0 .2rem; }
.verdict p { margin: 0; }
.v-bad { background: var(--red-tint); border-color: var(--red); color: var(--red-dark); }
.v-careful { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); }
.v-good { background: var(--green-tint); border-color: var(--green); color: var(--green); }
.v-bad p, .v-careful p, .v-good p { color: var(--ink); }
.reasons { list-style: none; padding: 0; margin: .5rem 0 1rem; display: grid; gap: .55rem; }
.reasons li { display: flex; gap: .6rem; align-items: flex-start; }
.reasons li .icon { margin-top: .1rem; color: var(--red); }
.reasons li .pts { margin-left: auto; font-weight: 800; color: var(--muted); white-space: nowrap; }

/* Risk score */
.score { display: flex; align-items: baseline; gap: .5rem; }
.score b { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.meter { position: relative; height: 1rem; border-radius: 999px; background: linear-gradient(90deg, var(--green) 0 34%, #D99A00 34% 67%, var(--red) 67% 100%); margin: .9rem 0 .3rem; }
.meter i { position: absolute; top: -.35rem; width: .5rem; height: 1.7rem; border-radius: 4px; background: var(--ink); border: 2px solid var(--card); transform: translateX(-50%); }
.meter-scale { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-weight: 600; }
.summary-row { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-top: 1px solid var(--border); }
.summary-row span:first-child { color: var(--muted); }
.summary-row span:last-child { font-weight: 700; text-align: right; }

/* Kopi break */
.kopi { text-align: center; background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.25rem; margin-bottom: 1rem; }
.kopi .cup { font-size: 3rem; line-height: 1; }
.kopi .time { font-size: 2.6rem; font-weight: 800; letter-spacing: -.02em; margin: .3rem 0 0; }
.bar { height: .6rem; border-radius: 999px; background: var(--border); overflow: hidden; margin: .6rem auto; max-width: 20rem; }
.bar span { display: block; height: 100%; background: var(--red); }

/* Caller check */
.captcha { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: 1rem; }
.captcha button { font: inherit; font-size: 3rem; min-height: 6rem; border-radius: var(--radius); border: 2.5px solid var(--border); background: var(--card); cursor: pointer; }
.captcha button:hover { border-color: var(--red); }
.captcha button span { display: block; font-size: .95rem; font-weight: 700; color: var(--ink); }
.big-code { font-size: 2.4rem; font-weight: 800; letter-spacing: .12em; text-align: center; background: var(--bg); border: 2px dashed var(--ink); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; font-variant-numeric: tabular-nums; }
.speak-code { text-align: center; color: var(--muted); margin-top: -.5rem; }
.demo-switch { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; background: var(--bg); border: 1.5px dashed var(--border); border-radius: var(--radius); padding: .6rem .8rem; margin-bottom: 1rem; font-size: .9rem; }
.demo-switch strong { margin-right: .25rem; }
.split { display: grid; gap: 1rem; }
@media (min-width: 44rem) { .split { grid-template-columns: 1fr 1fr; } }
.caller-view { background: var(--ink); color: var(--bg); border-radius: var(--radius-lg); padding: 1rem 1.1rem; }
.caller-view h2 { font-size: 1rem; color: var(--bg); }
.caller-view ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; font-size: .95rem; }
.caller-view .tag { display: inline-block; font-size: .78rem; font-weight: 700; background: var(--bg); color: var(--ink); border-radius: 999px; padding: .1rem .55rem; margin-bottom: .5rem; }

/* Passphrase, learn, report */
.saved { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem 0; border-top: 1px solid var(--border); }
.saved code { font-family: inherit; font-weight: 800; letter-spacing: .08em; }
.signs { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
.signs li { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; display: flex; gap: .8rem; }
.signs li .icon { color: var(--red); width: 1.8rem; height: 1.8rem; }
.signs strong { display: block; font-size: 1.05rem; }
.quiz-opt { display: block; width: 100%; text-align: left; }
.error { color: var(--red-dark); font-weight: 700; margin-top: .5rem; }
.ref { font-size: 1.6rem; font-weight: 800; letter-spacing: .05em; }
.toast { position: fixed; left: 50%; bottom: 6rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .7rem 1.1rem; border-radius: 999px; font-weight: 700; z-index: 20; box-shadow: var(--shadow); }
.tiles li.wide { grid-column: 1 / -1; }
.tile .chev-s { margin-left: auto; color: var(--muted); width: 1.2rem; height: 1.2rem; }
.badge-good { background: var(--green-tint); color: var(--green); }
.btn-secondary[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn .icon { width: 1.2rem; height: 1.2rem; }

/* ================= Match the team's Clarity front end (light mode) =================
   Same values as base.css + clarity.css + customer-home.css. Colours only, no content changes. */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --red: #ED1C24; --red-dark: #9E1B32; --red-tint: #FDEDEE;
  --ink: #363B40; --muted: #3D525D; --slate-tint: #EEF2F4;
  --bg: #F3F5F7; --card: #FFFFFF; --border: #E1E6EA;
  --green: #363B40; --green-tint: #EEF2F4;
  --amber: #9E1B32; --amber-tint: #FDEDEE;
}
:focus-visible { outline-color: var(--ink); }
.banner { background: var(--slate-tint); color: var(--ink); border-bottom: 1px solid #C9D2D7; font-size: .85rem; }
.text-size button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.text-size button, .read-btn { border: 2px solid #3D525D; }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); }
.btn-secondary { border-color: #3D525D; }
.btn-secondary:hover { background: var(--slate-tint); }
.btn-link { color: var(--muted); }

/* Help-now panel: the dark red urgent card with two soft circles */
.help-now { position: relative; overflow: hidden; background: var(--red-dark); color: #fff; border: 0; box-shadow: 0 16px 40px rgba(158, 27, 50, .25); }
.help-now::before, .help-now::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; pointer-events: none; }
.help-now::before { top: -9rem; right: -7rem; width: 22rem; height: 22rem; background: var(--red); opacity: .55; }
.help-now::after { right: 7rem; bottom: -8rem; width: 12rem; height: 12rem; background: rgba(255, 255, 255, .07); }
.help-now > * { position: relative; z-index: 1; }
.help-now h2 { color: #fff; }
.help-now { --red-focus: #fff; }
.help-now :focus-visible { outline-color: #fff; }
.big-choice { border: 0; background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.big-choice:hover { background: var(--red-tint); }
.big-choice .icon-wrap { background: var(--red); }
.big-choice span.sub { color: var(--muted); }
.big-choice .chev { color: var(--red-dark); }
.call-line { color: #fff; }
.call-line a { color: #fff; }

/* Tiles: icon in a soft red square, red border on hover */
.tile { border: 2px solid transparent; color: var(--ink); transition: border-color .15s, transform .15s, box-shadow .15s; }
.tile:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 2px 4px rgba(54, 59, 64, .06), 0 14px 32px rgba(54, 59, 64, .12); }
.tile > .icon:first-child { width: 3.25rem; height: 3.25rem; padding: .8rem; border-radius: 14px; background: var(--red-tint); color: var(--red-dark); box-sizing: border-box; }
.tile-wide { border-color: var(--red); }
.tile-wide > .icon:first-child { width: 3.25rem; height: 3.25rem; }
.group-title { color: var(--ink); }

/* Results follow the team's badges: solid dark red, red tint, or grey. Icon + words, never colour alone. */
.v-bad { background: var(--red-dark); border-color: var(--red-dark); color: #fff; }
.v-bad p, .v-bad h1, .v-bad h2 { color: #fff; }
.v-careful { background: var(--red-tint); border-color: var(--red); color: var(--red-dark); }
.v-good { background: var(--slate-tint); border-color: #3D525D; color: var(--ink); }
.badge-bad { background: var(--red-dark); color: #fff; }
.badge-unsure { background: var(--red-tint); color: var(--red-dark); border: 0; }
.badge-good { background: var(--slate-tint); color: var(--ink); }
.calm { background: var(--red-tint); color: var(--red-dark); }
.done-mark { background: var(--red-tint); color: var(--red-dark); }
.progress-list li.done .icon { color: var(--red-dark); }
.reasons li .icon { color: var(--red); }
.meter { background: linear-gradient(90deg, #C9D2D7 0 34%, #F4A3A7 34% 67%, var(--red) 67% 100%); }
.meter i { background: var(--ink); }
.bar span { background: var(--red); }

// Scam phrases looked for in typed or pasted messages
const PHRASES = [

let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

function announce(text) { document.getElementById("live").textContent = text; }
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text; t.setAttribute("role", "status");

// ================= Shared pieces =================
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}
function tilesHtml(list) {

function badge(level, label) {
  const cls = level === "bad" ? "badge-bad" : level === "good" ? "badge-good" : "badge-unsure";
  return `<span class="badge ${cls}">${icon(LEVELS[level].icon)}${label}</span>`;

// ================= Check anything (message + voice + screenshot + letter in one) =================
function detectKind(file) {
  const type = file.type || "";
  const name = file.name.toLowerCase();
  if (type.startsWith("audio/") || type.startsWith("video/") || /\.(mp3|m4a|wav|ogg|aac|amr|opus|mp4)$/.test(name)) return "voice";
  if (type.startsWith("image/") || /\.(png|jpe?g|heic|webp|gif)$/.test(name)) return "screenshot";
  if (type === "text/plain" || /\.txt$/.test(name)) return "message";
  return "document";
}
function analyseText(text) {
  const reasons = PHRASES.filter(([re]) => re.test(text)).map(([, why]) => why);
  if (reasons.length >= 2) return { level: "bad", title: "This message is likely a scam", reasons };
  if (reasons.length === 1) return { level: "careful", title: "Please be careful with this message", reasons };
  return { level: "good", title: "We did not find scam signs", reasons: ["No requests for codes, money or secrecy.", "No links or rushing words."] };
}
function startCheck(kind, name, text) {
  const c = S.check;
  Object.assign(c, { phase: "analysing", kind, name, text, step: 0, error: "" });
  c.result = kind === "message" ? analyseText(text) : FILE_RESULTS[kind];
  refresh();
  const tick = () => {
    if (location.hash !== "#check") return;
    c.step += 1;
    if (c.step >= KINDS[kind].steps.length) {
      c.phase = "result";
      S.recent.unshift({ level: c.result.level, label: LEVELS[c.result.level].word, what: name || "Pasted message", when: "Today" });
      announce(c.result.title);
    }
    refresh(c.phase === "result");
    if (c.phase !== "result") later(tick, 1100);
  };
  later(tick, 1100);
}
function checkHtml() {

  if (c.phase === "input") return `${pageTop()}

    </section>`;

  const detected = `<div class="detected">${icon(k.icon)}<span><strong>We found: ${k.label}</strong><small>${esc(c.name || "Pasted message")}</small></span></div>`;

        <h2>What to do now</h2>

          ? `<p>If anything still feels wrong, call OCBC yourself before you reply or pay.</p>`
          : `<p>Do not reply, tap links or send money. If you already did, freeze your accounts.</p>`}
        <div class="stack">
          ${r.level !== "good" ? `<a class="btn btn-primary btn-block" href="#report">Report this to OCBC</a><a class="btn btn-secondary btn-block" href="#freeze">I already sent money or a code</a>` : ""}
          <button type="button" class="btn btn-secondary btn-block" data-act="check-again">Check something else</button>

}

// ================= Transfer risk scorer =================
function money(n) { return "S$" + n.toLocaleString("en-SG"); }
function levelFor(score) { return score >= 67 ? "bad" : score >= 34 ? "careful" : "good"; }
function transferHtml() {

// ================= Kopi break (pause and verify) =================
const BREAK_SECONDS = 30;
function pauseLeft() { return Math.max(0, Math.ceil((S.pause.endsAt - Date.now()) / 1000)); }
function pauseHtml() {
  const p = S.pause;
  if (p.done) return transferDoneHtml(p.done === "sent");
  if (!p.endsAt) p.endsAt = Date.now() + BREAK_SECONDS * 1000;
  const left = pauseLeft();
  const picked = TRANSFERS.find(x => x.id === S.transfer.pick) || TRANSFERS[2];
  return `
    <section class="kopi" data-read>
      <p class="calm">${icon("lock")}Transfer paused. Your money is safe.</p>
      <h1 tabindex="-1" id="step-title">Wait ah, let's take a kopi break</h1>
      <div class="cup" aria-hidden="true">☕</div>
      <p class="time" id="pv-time" role="timer">00:${String(left).padStart(2, "0")}</p>
      <div class="bar" aria-hidden="true"><span id="pv-bar" style="width:${100 - left / BREAK_SECONDS * 100}%"></span></div>
      <p id="pv-label">${left ? "until you can decide" : "Your kopi break is over. Take your time."}</p>
    </section>
    <section class="card" data-read>
      <h2>Why we stopped ${money(picked.amount)}</h2>
      <ul class="reasons">${picked.factors.filter(f => f[1] >= 12).map(([why]) => `<li>${icon("warning")}<span>${why}</span></li>`).join("")}</ul>
      <h2>Is someone on the phone telling you to do this?</h2>
      <div class="stack answer-btns">
        <button type="button" class="btn btn-secondary btn-block" data-act="p-ans" data-v="yes" aria-pressed="${p.answer === "yes"}">Yes</button>
        <button type="button" class="btn btn-secondary btn-block" data-act="p-ans" data-v="no" aria-pressed="${p.answer === "no"}">No</button>
      </div>
      ${p.answer === "yes" ? `<div class="verdict v-bad" style="margin-top:1rem">${icon("warning")}<div><p><strong>This is a scam sign</strong></p><p>A real bank officer will never tell you to move money. Hang up and cancel.</p></div></div>` : ""}
      ${p.answer ? `<div class="stack">
        <button type="button" class="btn btn-primary btn-block" data-act="p-cancel">Cancel this transfer</button>
        <button type="button" class="btn btn-link" data-act="p-send" id="p-send" ${left ? "disabled" : ""}>I am sure, send it</button>
        <p class="note" id="p-wait" ${left ? "" : "hidden"}>You can send it when the kopi break ends.</p>
      </div>` : ""}
    </section>`;
}
function tickPause() {
  if (location.hash !== "#pause" || S.pause.done) return;
  const left = pauseLeft();
  const t = document.getElementById("pv-time");
  if (!t) return;
  t.textContent = "00:" + String(left).padStart(2, "0");
  document.getElementById("pv-bar").style.width = `${100 - left / BREAK_SECONDS * 100}%`;
  if (left > 0) { later(tickPause, 1000); return; }
  document.getElementById("pv-label").textContent = "Your kopi break is over. Take your time.";
  const send = document.getElementById("p-send"); if (send) send.disabled = false;
  const wait = document.getElementById("p-wait"); if (wait) wait.hidden = true;
  announce("Your kopi break is over.");
}

// ================= Is the caller a real person? (CAPTCHA handshake) =================
function randomDigits(n) { let s = ""; for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 10); return s; }
function humanHtml() {
  const h = S.human;
  const steps = { captcha: 1, code: 2, waiting: 3, otp: 4 };

  if (h.phase === "captcha") return `${top}
    <section class="card" data-read>
      <h1 tabindex="-1" id="step-title">First, a quick check for you</h1>
      <p class="lead">We give you a code to read to the caller. A real person can use it. A computer voice usually cannot.</p>
      <h2>Tap the cup of kopi</h2>
      ${h.wrong ? `<p class="error" role="alert">Not that one. Try again, there is no rush.</p>` : ""}
      <div class="captcha">${CAPTCHA.map(c => `<button type="button" data-act="cap" data-id="${c.id}" aria-label="${c.name}">${c.emoji}<span>${c.name}</span></button>`).join("")}</div>
    </section>`;

  if (h.phase === "code") return `${top}

      <p class="speak-code">Say it slowly: ${h.code.replace("-", "").split("").join(" ")}</p>
      <p>Ask them to open the OCBC Verify page and type it in. They then solve a picture puzzle, like you did.</p>
      <div class="stack">
        <button type="button" class="btn btn-primary btn-block" data-act="told">I have told them the code</button>
        <button type="button" class="btn btn-secondary btn-block" data-act="sms">Send the code by SMS instead</button>
      </div>
    </section>`;

  if (h.phase === "waiting" || h.phase === "otp") {
    const demo = `<div class="demo-switch" role="group" aria-label="Demo: who is the caller?"><strong>Demo, who is calling?</strong>
      <button type="button" class="chip" data-act="sim" data-v="human" aria-pressed="${h.sim === "human"}">A real person</button>
      <button type="button" class="chip" data-act="sim" data-v="ai" aria-pressed="${h.sim === "ai"}">An AI voice bot</button></div>`;
    const callerView = `<aside class="caller-view" aria-label="What the caller sees (demo)"><span class="tag">Demo: the caller's screen</span>
      <h2>OCBC Verify page</h2><ol>${h.log.map(l => `<li>${l}</li>`).join("") || "<li>Waiting for the caller to open the page...</li>"}</ol></aside>`;
    const mine = h.phase === "waiting" ? `
      <section class="card" data-read>
        <h1 tabindex="-1" id="step-title">Waiting for the caller...</h1>
        <p>They have <strong id="h-left">${h.left}</strong> seconds to type the code and solve the puzzle.</p>
        <ul class="progress-list"><li class="now"><span class="spin" aria-hidden="true"></span><span>Waiting for the caller</span></li></ul>
      </section>` : `
      <section class="card" data-read>
        <h1 tabindex="-1" id="step-title">The caller finished the check</h1>
        <p>You and the caller now both have a 6-digit number. Ask them to read theirs to you.</p>
        <div class="big-code">${h.otp.slice(0, 3)} ${h.otp.slice(3)}</div>
        <h2>Does it match what they said?</h2>
        <div class="stack answer-btns">
          <button type="button" class="btn btn-secondary btn-block" data-act="otp" data-v="yes">Yes, it is the same</button>
          <button type="button" class="btn btn-secondary btn-block" data-act="otp" data-v="no">No, it is different</button>
        </div>
      </section>`;
    return `${top}${h.phase === "waiting" ? demo : ""}<div class="split">${mine}${callerView}</div>`;
  }

  if (h.phase === "matched") return `${pageTop()}
    <section data-read>
      <div class="verdict v-good">${icon("check")}<div><p><strong>Real person</strong></p><h1 tabindex="-1" id="step-title">The caller is a real person</h1></div></div>
      <div class="card">
        <p><strong>This does not show they are from OCBC.</strong> Scammers can be real people too.</p>
        <p>Never share your OTP or send money because a caller asks.</p>
        <div class="stack">
          <a class="btn btn-primary btn-block" href="#call-match">Check if OCBC is really calling</a>
          <a class="btn btn-secondary btn-block" href="#home">Back to home</a>

  return `${pageTop()}
    <section data-read>

      <div class="card">
        <p>${h.phase === "failed" ? "They could not solve the puzzle in time." : "Their number did not match yours."} This may be a computer (AI) voice, or someone you should not trust.</p>
        <p><strong>Hang up now.</strong> Do not share any code or send money.</p>
        <div class="stack">
          <a class="btn btn-primary btn-block" href="${HOTLINE_TEL}">${icon("phone")}Call OCBC ${HOTLINE}</a>
          <a class="btn btn-secondary btn-block" href="#report">Report this call</a>
          <button type="button" class="btn btn-link" data-act="h-again">Start the check again</button>
        </div>
      </div>
    </section>`;
}
// Plays out what the caller does on their side, so the demo shows both ends
function runCaller() {
  const h = S.human;
  h.log = []; h.left = 60;
  const script = h.sim === "human"
    ? [[1500, `Typed code ${h.code}`], [1500, "Puzzle shown: tap the cup of kopi"], [2000, "Tapped the cup of kopi. Correct."]] 
    : [[1200, `Typed code ${h.code}`], [1200, "Puzzle shown: tap the cup of kopi"], [1600, "Tapped the bus. Wrong."], [1600, "Tapped the umbrella. Wrong."], [1600, "Too many wrong tries. Check stopped."]];
  let i = 0;
  const step = () => {
    if (location.hash !== "#human-check" || h.phase !== "waiting") return;
    if (i < script.length) {
      h.log.push(script[i][1]);
      i++;
      refresh(false);
      if (i < script.length) later(step, script[i][0]);
      else later(finish, 900);
    }
  };
  const finish = () => {
    if (h.phase !== "waiting") return;
    if (h.sim === "human") { h.otp = randomDigits(6); h.log.push(`Their screen now shows: ${h.otp.slice(0, 3)} ${h.otp.slice(3)}`); h.phase = "otp"; announce("The caller finished the check."); }
    else { h.phase = "failed"; announce("The caller could not pass the check."); }
    refresh();
  };
  const countdown = () => {
    if (h.phase !== "waiting" || location.hash !== "#human-check") return;
    h.left = Math.max(0, h.left - 1);
    const el = document.getElementById("h-left");
    if (el) el.textContent = h.left;
    if (h.left === 0) { h.phase = "failed"; refresh(); return; }
    later(countdown, 1000);
  };
  later(step, script[0][0]);
  later(countdown, 1000);
}

      <h1 tabindex="-1" id="step-title">Your report is sent</h1>
      <p>Your report number is</p><p class="ref">${r.ref}</p>
      <p>An OCBC officer will look at it. If they call you, they will never ask for your OTP.</p>
      <p>You can also tell the police: 1800 255 0000, or the ScamShield Helpline: 1799.</p>
      <div class="stack"><a class="btn btn-primary btn-block" href="#home">Back to home</a></div>
    </section>`;
  const choice = (name, v, label) => `<button type="button" class="chip" data-act="r-${name}" data-v="${v}" aria-pressed="${r[name] === v}">${label}</button>`;
  return `${pageTop()}
    <section class="card" data-read>
      <h1 tabindex="-1" id="step-title">Report a scam</h1>
      <p class="lead">Tell us what happened. Short answers are fine.</p>
    </section>
    <section class="card">
      <h2>What happened?</h2>
      <div class="chips">${choice("what", "call", "A phone call")}${choice("what", "message", "A message")}${choice("what", "sent", "I sent money")}${choice("what", "other", "Something else")}</div>
      <label class="field" for="r-contact">Their phone number or link (if you have it)</label>
      <input type="text" id="r-contact" value="${esc(r.contact)}">
      <h2 style="margin-top:1.2rem">Did you lose money?</h2>
      <div class="chips">${choice("lost", "yes", "Yes")}${choice("lost", "no", "No")}${choice("lost", "unsure", "Not sure")}</div>
      ${r.lost === "yes" ? `<label class="field" for="r-amount">About how much? (S$)</label><input type="number" id="r-amount" inputmode="decimal" value="${esc(r.amount)}">` : ""}
      <label class="field" for="r-more">Anything else? (optional)</label>
      <textarea id="r-more">${esc(r.more)}</textarea>
      ${r.error ? `<p class="error" role="alert">${r.error}</p>` : ""}
      <div class="stack">
        <button type="button" class="btn btn-primary btn-block" data-act="r-send">Send to OCBC</button>
        ${r.lost === "yes" ? `<a class="btn btn-secondary btn-block" href="#freeze">Freeze my accounts first</a>` : ""}
      </div>
    </section>`;
}

// ================= Router =================
const ROUTES = {
  home: homeHtml, ...CALL_SCREENS, freeze: freezeHtml, check: checkHtml, "call-match": matchHtml,
  transfer: () => S.transfer.result ? transferDoneHtml(S.transfer.result === "sent") : transferHtml(),
  pause: pauseHtml, "human-check": humanHtml, passphrase: passHtml, learn: learnHtml, report: reportHtml
};
const STRESS = ["call-1", "call-2", "call-safe", "freeze", "pause"];

function route() { return location.hash.slice(1) || "home"; }

// Draws the current screen. focus=true moves focus to the main heading (new screen or new step).
function refresh(focus = true) {
  stopReading();
  const r = route();
  const app = document.getElementById("app");
  app.innerHTML = (ROUTES[r] || homeHtml)();
  document.querySelectorAll(".app-nav a").forEach(a => {
    if (a.dataset.nav === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("bar-slot").innerHTML = STRESS.includes(r)
    ? `<div class="call-bar"><div class="in"><p>Want to talk to a real person?</p><a class="btn btn-primary" href="${HOTLINE_TEL}">${icon("phone")}Call OCBC</a></div></div>` : "";
  wireScreen(r);
  if (focus) {
    const h = document.getElementById("step-title") || app.querySelector("h1");
    if (h) h.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

let firstLoad = true;
window.addEventListener("hashchange", () => {
  clearTimers();
  // Coming into a feature again starts it fresh (except the frozen state and the passphrases)
  const r = route();
  const keep = freshState();
  if (r === "check") S.check = keep.check;
  if (r === "call-match") S.match = keep.match;
  if (r === "transfer") S.transfer = keep.transfer;
  if (r === "pause") S.pause = keep.pause;
  if (r === "human-check") S.human = keep.human;
  if (r === "report") S.report = keep.report;
  refresh();
});

// Things a screen needs after it is drawn (inputs, drag and drop, timers)
function wireScreen(r) {
  if (r === "check" && S.check.phase === "input") {
    const drop = document.getElementById("drop");
    const take = file => { if (file) startCheck(detectKind(file), file.name, ""); };
    document.getElementById("file-in").addEventListener("change", e => take(e.target.files[0]));
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => take(e.dataTransfer.files[0]));
    document.getElementById("msg").addEventListener("input", e => { S.check.text = e.target.value; });
  }
  if (r === "call-match" && S.match.phase === "input") document.getElementById("num").addEventListener("input", e => { S.match.number = e.target.value; });
  if (r === "pause" && !S.pause.done) { clearTimers(); later(tickPause, 1000); }
  if (r === "passphrase") {
    document.getElementById("word").addEventListener("input", e => { S.pass.word = e.target.value; });
    document.getElementById("who").addEventListener("change", e => { S.pass.who = e.target.value; });
  }
  if (r === "report" && S.report.phase === "form") {
    document.getElementById("r-contact").addEventListener("input", e => { S.report.contact = e.target.value; });
    document.getElementById("r-more").addEventListener("input", e => { S.report.more = e.target.value; });
    const amt = document.getElementById("r-amount");
    if (amt) amt.addEventListener("input", e => { S.report.amount = e.target.value; });
  }
}

// ================= Buttons: one listener for every data-act button =================
function onAct(btn) {
  const v = btn.dataset.v;
  switch (btn.dataset.act) {
    case "freeze": S.frozen = true; announce("Your accounts are frozen."); break;
    // Check anything
    case "check-text":
      if (!S.check.text.trim()) { S.check.error = "Please paste a message, add a file, or try a sample."; break; }
      startCheck("message", "", S.check.text.trim()); return;
    case "sample": {
      const s = SAMPLES[+btn.dataset.i];
      if (s.kind === "message") { S.check.text = s.text; startCheck("message", "", s.text); }
      else startCheck(s.kind, s.name, "");
      return;
    }
    case "check-again": S.check = freshState().check; break;
    // Call match
    case "num": S.match.number = v; break;
    case "match": {
      const digits = S.match.number.replace(/\D/g, "").replace(/^65(?=\d{8}$)/, "");
      if (digits.length < 8) { S.match.error = "Please type the 8-digit number that called you."; break; }
      S.match.result = OUTBOUND.find(o => o.digits === digits) || null;
      S.match.phase = "result"; S.match.error = "";
      break;
    }
    case "match-again": S.match = freshState().match; break;
    // Transfer
    case "pick": S.transfer.pick = btn.dataset.id; break;
    case "score": {
      const t = S.transfer, picked = TRANSFERS.find(x => x.id === t.pick);
      t.score = Math.min(100, picked.factors.reduce((sum, f) => sum + f[1], 0));
      t.phase = "scoring"; refresh();
      later(() => { t.phase = "result"; announce(`Risk score ${t.score} out of 100`); refresh(); }, 1400);
      return;
    }
    case "t-send": S.transfer.result = "sent"; break;
    case "t-cancel": S.transfer.result = "cancelled"; break;
    case "t-again": S.transfer = freshState().transfer; break;
    // Kopi break
    case "p-ans": S.pause.answer = v; refresh(false); return;
    case "p-cancel": S.pause.done = "cancelled"; break;
    case "p-send": if (pauseLeft() > 0) return; S.pause.done = "sent"; break;
    // Caller check
    case "cap":
      if (btn.dataset.id === "kopi") { S.human.phase = "code"; S.human.wrong = false; S.human.code = "KOPI-" + randomDigits(4); }
      else { S.human.wrong = true; announce("Not that one. Try again."); }
      break;
    case "sms": toast("Code sent by SMS (demo)"); return;
    case "told": S.human.phase = "waiting"; refresh(); runCaller(); return;
    case "sim": S.human.sim = v; clearTimers(); refresh(false); runCaller(); return;
    case "otp": S.human.phase = v === "yes" ? "matched" : "mismatch"; break;
    case "h-again": S.human = freshState().human; break;
    // Passphrase
    case "show": S.pass.shown = S.pass.shown === +btn.dataset.i ? -1 : +btn.dataset.i; refresh(false); return;
    case "save-pass":
      if (S.pass.word.trim().length < 3) { S.pass.error = "Please type a word with at least 3 letters."; break; }
      S.pass.list.push({ who: S.pass.who, word: S.pass.word.trim() });
      S.pass.word = ""; S.pass.error = ""; toast("Passphrase saved"); break;
    // Learn
    case "quiz": S.learn.picked = v; refresh(false); return;
    // Report
    case "r-what": S.report.what = v; refresh(false); return;
    case "r-lost": S.report.lost = v; refresh(false); return;
    case "r-send":
      if (!S.report.what || !S.report.lost) { S.report.error = "Please answer the two questions with buttons."; break; }
      S.report.phase = "sent"; S.report.ref = "SR-26-" + randomDigits(5); break;
  }
  refresh();
}

// ---------- Text size ----------
function setTextSize(size) {
  document.documentElement.dataset.size = size;
  document.querySelectorAll(".text-size button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.size === size)));
  try { localStorage.setItem("vtc-text-size", size); } catch (e) { /* not remembered */ }
}
try { setTextSize(localStorage.getItem("vtc-text-size") || "normal"); } catch (e) { setTextSize("normal"); }

// ---------- Read aloud, with the word being spoken highlighted ----------
const canSpeak = "speechSynthesis" in window;
const readBtn = document.getElementById("read-btn");
let words = [];          // [{ span, start }] in reading order
let fallbackTimer = null;
let gotBoundary = false;
let reading = false;

function setReadButton(on) {
  reading = on;
  readBtn.setAttribute("aria-pressed", String(on));
  readBtn.innerHTML = on ? `${icon("stop")}<span class="visually-hidden">Stop reading</span>` : `${icon("speaker")}<span class="visually-hidden">Read aloud</span>`;
  readBtn.title = on ? "Stop reading" : "Read aloud";
  document.getElementById("app").classList.toggle("reading", on);
}
if (!canSpeak) readBtn.hidden = true; else setReadButton(false);

// Wraps every word inside the [data-read] areas in <span class="w">, once, and builds the
// text to speak. Each word remembers where it starts in that text, so the browser's
// "I'm now at character N" event can be matched back to a word on screen.
function prepareWords() {
  words = [];
  let text = "";
  document.querySelectorAll("#app [data-read]").forEach(area => {
    if (!area.dataset.wrapped) {
      const walker = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, {
        acceptNode: n => n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const frag = document.createDocumentFragment();
        node.nodeValue.split(/(\s+)/).forEach(piece => {
          if (!piece) return;
          if (/^\s+$/.test(piece)) { frag.appendChild(document.createTextNode(piece)); return; }
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = piece;
          frag.appendChild(s);
        });
        node.parentNode.replaceChild(frag, node);
      });
      area.dataset.wrapped = "yes";
    }
    // Skip words that are hidden (for example visually-hidden helper text)
    area.querySelectorAll(".w").forEach(span => {
      if (span.closest(".visually-hidden") || span.closest("[hidden]")) return;
      words.push({ span, start: text.length });
      text += span.textContent + " ";
    });
    text += "\n";
  });
  return text;
}

function clearMark() {
  document.querySelectorAll(".w.now").forEach(s => s.classList.remove("now"));
}

function markWord(i) {
  clearMark();
  const w = words[i];
  if (!w) return;
  w.span.classList.add("now");
  const r = w.span.getBoundingClientRect();
  if (r.top < 80 || r.bottom > innerHeight - 90) w.span.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

// The last word that starts at or before this character position
function wordAt(charIndex) {
  let found = 0;
  for (let i = 0; i < words.length; i++) {
    if (words[i].start <= charIndex) found = i; else break;
  }
  return found;
}

// Some voices never send word events. Then we move the highlight on a timer instead:
// a rough guess of how long each word takes to say at this speed.
function startFallback(rate) {
  let i = 0;
  const step = () => {
    if (!reading || gotBoundary || i >= words.length) return;
    markWord(i);
    const len = words[i].span.textContent.length;
    const pause = /[.,?!:]$/.test(words[i].span.textContent) ? 260 : 0;
    i++;
    fallbackTimer = setTimeout(step, (180 + len * 55 + pause) / rate);
  };
  step();
}

function stopReading() {
  if (canSpeak) speechSynthesis.cancel();
  clearTimeout(fallbackTimer);
  clearMark();
  if (canSpeak) setReadButton(false);
}

function pickVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  // On-device voices are the ones most likely to report each word as it is spoken
  return voices.find(v => v.localService && /SG|GB/.test(v.lang)) || voices.find(v => v.localService) || voices[0] || null;
}

function startReading() {
  const text = prepareWords();
  if (!words.length) return;
  const talk = new SpeechSynthesisUtterance(text);
  talk.rate = 0.9;
  const voice = pickVoice();
  if (voice) talk.voice = voice;
  gotBoundary = false;
  talk.onboundary = e => {
    if (e.name && e.name !== "word") return;
    gotBoundary = true;
    clearTimeout(fallbackTimer);
    markWord(wordAt(e.charIndex));
  };
  talk.onstart = () => {
    setTimeout(() => { if (reading && !gotBoundary) startFallback(talk.rate); }, 700);
  };
  talk.onend = stopReading;
  talk.onerror = stopReading;
  setReadButton(true);
  speechSynthesis.cancel();
  speechSynthesis.speak(talk);
}


// ================= One click listener for the page =================
document.addEventListener("click", e => {
  const el = e.target.closest("button, a");
  if (!el) return;
  if (el.dataset.size) setTextSize(el.dataset.size);
  else if (el.id === "read-btn") reading ? stopReading() : startReading();
  else if (el.dataset.act) onAct(el);
});

refresh(false);
</script>
</body>
